[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learner"
version = "0.1.0"
description = "Autonomous AI personal tutor harness: probe -> plan -> teach, with a live Markdown/Obsidian log"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ai-learner = "ai_learner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
